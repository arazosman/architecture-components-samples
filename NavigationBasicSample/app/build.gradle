plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace = "com.example.android.navigationsample"
    compileSdk = build_versions.compile_sdk
    defaultConfig {
        applicationId = "com.example.android.navigationsample"
        minSdk = build_versions.min_sdk
        targetSdk = build_versions.target_sdk
        versionCode = 1
        versionName = "1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        compose = true
    }

    // Robolectric
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    sourceSets {
        named("androidTest") {
            java.directories.add("src/uiTest/java")
            kotlin.directories.add("src/uiTest/java")
        }
        named("test") {
            java.directories.add("src/uiTest/java")
            kotlin.directories.add("src/uiTest/java")
            resources.directories.add("src/uiTest/resources")
        }
    }
}

dependencies {
    implementation 'androidx.navigation:navigation-fragment-ktx:2.10.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.10.2'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation deps.kotlin.stdlib
    implementation deps.app_compat
    implementation deps.material
    implementation deps.constraint_layout
    implementation deps.core_ktx

    implementation deps.lifecycle.viewmodel_ktx

    implementation deps.navigation.fragment_ktx
    implementation deps.navigation.runtime_ktx
    implementation deps.fragment.runtime_ktx

    implementation platform(deps.compose.bom)
    implementation deps.compose.ui
    implementation deps.compose.material3
    implementation deps.compose.ui_tooling_preview
    debugImplementation deps.compose.ui_tooling
    debugImplementation deps.compose.ui_test_manifest
    implementation deps.activity.compose
    implementation deps.kotlinx_serialization_core
    implementation deps.navigation3.runtime
    implementation deps.navigation3.ui

    // "androidx.fragment:fragment-testing" must be scoped to all sourcesets.
    implementation deps.fragment.testing
    // Forcing androidx.test:core version
    implementation deps.atsl.core

    // Espresso and UI Testing
    androidTestImplementation platform(deps.compose.bom)
    androidTestImplementation deps.compose.ui_test_junit4
    androidTestImplementation deps.atsl.core
    androidTestImplementation deps.atsl.ext_junit
    androidTestImplementation deps.espresso.core
    androidTestImplementation deps.espresso.contrib
    androidTestImplementation deps.espresso.intents
    androidTestImplementation deps.navigation.testing
    androidTestImplementation deps.truth

    // Host-side tests
    testImplementation platform(deps.compose.bom)
    testImplementation deps.compose.ui_test_junit4
    testImplementation deps.atsl.core
    testImplementation deps.atsl.ext_junit
    testImplementation deps.robolectric
    // Espresso API running in Robolectric
    testImplementation deps.espresso.core
    testImplementation deps.espresso.contrib
    testImplementation deps.espresso.intents
    testImplementation deps.navigation.testing
    testImplementation deps.truth
}
